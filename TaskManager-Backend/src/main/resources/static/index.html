<!DOCTYPE html>
<html>
<head>
    <title>System Monitor Live</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
        }
        .card {
            background: #222;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
        }
        h2 { color: #4CAF50; }
    </style>
</head>
<body>

<h1>🔥 Live System Monitor</h1>

<div class="card">
    <h2>CPU</h2>
    <div id="cpu"></div>
</div>

<div class="card">
    <h2>Memory</h2>
    <div id="memory"></div>
</div>

<div class="card">
    <h2>Processes</h2>
    <div id="processes"></div>
</div>

<script>
    var socket = new SockJS('/ws');
    var stompClient = Stomp.over(socket);

    stompClient.connect({}, function () {

        console.log("Connected to WebSocket");

        stompClient.subscribe('/topic/metrics', function (message) {

            var data = JSON.parse(message.body);

            // CPU
            document.getElementById("cpu").innerHTML =
                "Usage: " + data.cpu.systemLoad + "%";

            // Memory
            document.getElementById("memory").innerHTML =
                "Used: " + data.memory.usedGB + " GB (" +
                data.memory.usagePercent + "%)";

            // Processes (Top 5)
            let processHtml = "";
            data.processes.slice(0,5).forEach(p => {
                processHtml += p.name + 
                    " (CPU: " + p.cpuLoad + "%)<br>";
            });

            document.getElementById("processes").innerHTML = processHtml;
        });
    });
</script>
</body>
</html>
