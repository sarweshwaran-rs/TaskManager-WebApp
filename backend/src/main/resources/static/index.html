<!DOCTYPE html>
<html>

<head>
    <title>Live System Monitor - Auto</title>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <style>
        /* Navbar only */
        .navbar {
            background-color: #222;
            padding: 10px;
            color: white;
        }

        .navbar span {
            margin-right: 20px;
        }
    </style>
</head>

<body>

    <div class="navbar">
        <span>WebSocket Status: <b id="wsStatus">Connecting...</b></span>
        <span>Last Updated: <b id="lastUpdated">--</b></span>
    </div>

    <h2>CPU</h2>
    <div id="cpu"></div>

    <h2>Memory</h2>
    <div id="memory"></div>

    <h2>Top 5 Processes</h2>
    <div id="processes"></div>

    <h2>Disks</h2>
    <div id="disks"></div>

    <h2>Network</h2>
    <div id="network"></div>

    <h2>Health</h2>
    <div id="health"></div>

    <script>

        let wsStatus = document.getElementById("wsStatus");
        let lastUpdated = document.getElementById("lastUpdated");

        var socket = new SockJS('/ws');
        var stompClient = Stomp.over(socket);

        stompClient.connect({}, function () {

            wsStatus.innerText = "Connected";

            stompClient.subscribe('/topic/snapshot', function (message) {

                let data = JSON.parse(message.body);

                lastUpdated.innerText = new Date().toLocaleTimeString();

                /* ---------------- CPU ---------------- */
                document.getElementById("cpu").innerHTML =
                    "Total Load: " + data.cpu.systemLoad + "%<br>" +
                    "Per Core: " + data.cpu.perCoreLoad.join(" , ");

                /* ---------------- MEMORY ---------------- */
                document.getElementById("memory").innerHTML =
                    "Used: " + data.memory.usedGB + " GB / " +
                    data.memory.totalGB + " GB<br>" +
                    "Usage: " + data.memory.usagePercent + "%";

                /* ---------------- PROCESSES ---------------- */
                let topProcesses = data.processes
                    .sort((a, b) => b.cpuLoad - a.cpuLoad)
                    .slice(0, 5);

                let processHtml = "";
                topProcesses.forEach(p => {
                    processHtml += p.name +
                        " (PID: " + p.pid +
                        ", CPU: " + p.cpuLoad + "%)<br>";
                });

                document.getElementById("processes").innerHTML = processHtml;

                /* ---------------- DISKS ---------------- */
                let diskHtml = "";
                data.disks.forEach(d => {
                    d.partitions.forEach(p => {
                        diskHtml += p.mountPoint +
                            " → " + p.usagePercent + "%<br>";
                    });
                });
                document.getElementById("disks").innerHTML = diskHtml;

                /* ---------------- NETWORK ---------------- */
                let netHtml = "";
                data.networks.forEach(n => {
                    netHtml += n.displayName +
                        " (" + n.ipV4 + ")<br>";
                });
                document.getElementById("network").innerHTML = netHtml;

                /* ---------------- HEALTH ---------------- */
                fetch('/api/health')
                    .then(res => res.json())
                    .then(h => {
                        let healthHtml = "Overall: " + h.overallStatus + "<br>";
                        h.components.forEach(c => {
                            healthHtml += c.component +
                                " → " + c.healthStatus + "<br>";
                        });
                        document.getElementById("health").innerHTML = healthHtml;
                    });

            });

        }, function () {
            wsStatus.innerText = "Disconnected";
        });

    </script>

</body>
</html>
